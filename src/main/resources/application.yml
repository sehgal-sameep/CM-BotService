server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: cm-bot-service
  autoconfigure:
    exclude:
      # The ReactiveRedisConnectionFactory bean RedisSessionConfig depends on actually
      # comes from DataRedisAutoConfiguration (Lettuce's connection factory implements
      # both the blocking and reactive interfaces) — DataRedisReactiveAutoConfiguration
      # is NOT needed for that, it only adds its own ReactiveRedisTemplate/
      # ReactiveStringRedisTemplate beans on top, which collide with RedisSessionConfig's
      # own ReactiveStringRedisTemplate bean (an ambiguous-bean startup failure once a
      # real SessionStore implementation actually autowires one — invisible to this
      # repo's own tests, which all stub SessionStore out). Excluded to leave exactly
      # one ReactiveStringRedisTemplate bean.
      - org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration
      # Boot auto-registers a live Redis ping as part of /actuator/health the moment
      # any ReactiveRedisConnectionFactory bean exists — same principle as the ML
      # Agent circuit breaker being kept out of the readiness group (see below): this
      # is a read-only, best-effort session lookup, not a dependency whose outage
      # should flip this service's own health/readiness. Excluded rather than solved
      # via the readiness-group mechanism since it shouldn't affect the plain
      # /actuator/health aggregate either — unlike the circuit breaker case, an
      # unreachable session-auth Redis has its own explicit handling
      # (chatbot.security.fail-open-on-redis-error / a 503 error response), so a
      # second, redundant health signal adds noise without adding safety.
      - org.springframework.boot.data.redis.autoconfigure.health.DataRedisReactiveHealthContributorAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.health.DataRedisHealthContributorAutoConfiguration
  lifecycle:
    # How long in-flight requests/streams get to finish on shutdown before being force-closed.
    timeout-per-shutdown-phase: 20s
  codec:
    # Bounds the server-side request body buffer (this API's payloads are tiny JSON bodies;
    # generous but not unbounded). The ML-agent WebClient has its own, separately configured limit.
    max-in-memory-size: 256KB
  data:
    redis:
      # The shared Redis instance FMC-PM-BFF also reads/writes BFF sessions in — this
      # service only ever GETs from it (RedisSessionConfig/JsonBlobSessionStore), never
      # writes. Local/dev default (localhost:6379, no TLS, no passwordless auth, an
      # optional plain password) matches a local Redis container; a real environment
      # sets REDIS_HOST to the Azure Cache for Redis hostname (port 6380, SSL, Entra
      # ID/managed-identity passwordless auth — no password/connection string here at
      # all in that case).
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      azure:
        passwordless-enabled: ${REDIS_AZURE_PASSWORDLESS_ENABLED:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # Explicit: a downstream ML Agent outage must never pull an otherwise-healthy
        # instance out of rotation — that's the circuit breaker's job, not readiness's.
        # The circuit-breaker health indicator still affects the plain /actuator/health
        # aggregate (useful signal there), just never this group.
        readiness:
          include: readinessState
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}

chatbot:
  security:
    # Master toggle. BFF_SESSION = minimal validation flow enabled (production): a
    # found Redis session is trusted as authenticated, full stop — no fingerprint,
    # CSRF, permission, or expiry check (see docs/ARCHITECTURE.md §20 for the current,
    # deliberately reduced scope). NONE = bypass all authentication, permit all
    # requests (local dev only — a loud warning is logged on every startup while this
    # is active). Everything below this line only applies when mode: BFF_SESSION.
    mode: ${CHATBOT_SECURITY_MODE:NONE}
    session:
      # Cookie carrying the BFF-issued session identifier.
      cookie-name: SESSION
      # Header carrying the caller's tenant — part of the Redis key below. Reuses the
      # same always-required X-Tenant-Id header every request already sends
      # (RequestHeaders.TENANT_ID), rather than a separate custom header.
      tenant-header-name: X-Tenant-Id
    redis:
      # Selects the SessionStore bean. "json-blob" is the confirmed FMC-PM-BFF layout:
      # one JSON document at key "{namespace}:{sessionId}:{tenant}", whose contextJson
      # field is itself a JSON string carrying username/tenantId.
      strategy: json-blob
      namespace: "session"
      # Field names inside the JSON document stored per session (not the nested
      # contextJson payload, which has a fixed shape). Kept configurable so a naming
      # change on FMC-PM-BFF's side needs a config change here, not a code change.
      field-names:
        context-json: context_json
        access-token: access_token
        refresh-token: refresh_token
        fingerprint: fp
    cors:
      # Comma-separated list of allowed origins, e.g. "https://app.example.com,https://other.example.com".
      # Empty (the safe default) allows none — must be set explicitly per environment.
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    # Insecure escape hatch for local development only: if the shared Redis is
    # unreachable, permit the request through anyway instead of rejecting with 503.
    # Must never be true in a shared/prod environment — intentionally NOT
    # environment-variable-driven so it can't be flipped on in Azure by mistake.
    fail-open-on-redis-error: false

ml-agent:
  # "mock" (default, MockMlAgentClient) or "grpc" (GrpcMlAgentClient, real gRPC calls).
  mode: ${ML_AGENT_MODE:mock}
  # Only used in mode: grpc — still required (non-blank/positive) because these
  # properties are bound and validated at startup regardless of which client bean ends
  # up active.
  grpc-host: ${ML_AGENT_GRPC_HOST:localhost}
  grpc-port: ${ML_AGENT_GRPC_PORT:9090}
  # First-response and idle-stream timeouts share one Reactor operator (see
  # ChatOrchestrationService) but are independently configurable. No separate gRPC
  # deadline is configured — this is the one, client-agnostic timeout authority.
  first-response-timeout: ${ML_AGENT_FIRST_RESPONSE_TIMEOUT:5s}
  idle-timeout: ${ML_AGENT_IDLE_TIMEOUT:15s}
  grpc-max-inbound-message-size: 1MB

resilience:
  circuit-breaker:
    failure-rate-threshold: 50
    sliding-window-size: 10
    wait-duration-in-open-state: 30s
    permitted-calls-in-half-open-state: 3
    minimum-number-of-calls: 5
  bulkhead:
    max-concurrent-calls: 50
    max-wait-duration: 0s
  retry:
    max-attempts: 3
    initial-backoff: 200ms
    max-backoff: 2s
    jitter-factor: 0.5

chat:
  # Operationally tunable ceiling, checked at runtime — works alongside (not instead
  # of) the hard compile-time @Size(max = 4000) backstop on ChatRequest.message.
  max-message-length: 4000
  # Absolute ceiling on one ML Agent call's total duration, regardless of activity —
  # see ChatOrchestrationServiceImpl#withTotalDeadline.
  max-stream-duration: 45s

app:
  mock-ml-agent:
    # Delay between chunks for a normal ("success") simulated response.
    chunk-delay-ms: 300
    # Delay between chunks when the caller triggers the "slow" scenario.
    slow-chunk-delay-ms: 1500

logging:
  pattern:
    # %clr is Spring Boot's built-in Logback color converter (org.springframework.boot.logging.logback.ColorConverter).
    # It auto-detects a real terminal and no-ops (plain text, no escape codes) when output isn't a console
    # (e.g. redirected to a file or picked up by a log aggregator), so this is safe for any environment.
    # %clr(%-5level) with no color argument uses Boot's built-in per-level coloring: ERROR=red, WARN=yellow, else=green.
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr([%thread]){faint} %clr(%-5level) %clr([corrId=%X{correlationId:-},tenant=%X{tenantId:-},case=%X{caseId:-},trace=%X{traceId:-},span=%X{spanId:-}]){cyan} %clr(%logger{36}){blue} %clr(-){faint} %msg%n%wEx"
  level:
    com.cmbotservice: ${LOG_LEVEL_COM_CMBOTSERVICE:DEBUG}
