syntax = "proto3";

// Module-neutral types shared by every ChatAgent RPC, per Thoughtful Labs'
// finalized 3-file contract (see ../../docs/case_manager.proto, chat_agent.proto,
// common.proto for the originals, and ../../docs/ARCHITECTURE.md for background).
// This file must not import a module file (case_manager.proto, ...).

package cmbotservice.mlagent.v1;

option java_package = "com.cmbotservice.mlagent.grpc.v1";
option java_multiple_files = true;

// Represents the context of the actor making the request to the ML Agent.
message AgentRequestContext {
  // Tenant identifier associated with the request.
  string tenant = 1;

  // Organization identifier associated with the request.
  string organization = 2;

  // Groups related requests for tracing and metrics. Carries no server-side
  // state; `history` on the request is the sole transcript.
  string agent_session_id = 3;

  // Unique per request. Populated by the caller from the FMC trace id
  // (TraceIdFilter) so agent logs join to platform logs for the same action.
  string request_id = 4;
}

// Represents a single turn in the conversation between the user and the ML Agent.
message ConversationTurn {
  message UserTurn  { string prompt = 1; }
  message AgentTurn { string text   = 1; }

  oneof turn {
    UserTurn  user  = 1;
    AgentTurn agent = 2;
  }
}

// Incremental text generated by the ML Agent.
message Chunk {
  string delta = 1;
}

// Indicates that the ML Agent invoked a tool.
message ToolCall {
  // Tool identifier matching the corresponding ToolResult.
  string tool_call_id = 1;

  // Name of the tool being invoked.
  string name = 2;

  // Tool-specific arguments serialized as JSON.
  string args_json = 3;
}

// Result of a tool invocation.
message ToolResult {
  // Outcome of the call. UI maps this to a label on the trace card.
  // Clients MUST treat any unrecognised value as STATUS_FAILED.
  // Debug detail is in server logs under request_id.
  enum Status {
    // Unspecified status.
    STATUS_UNSPECIFIED = 0;
    // Tool invocation completed successfully.
    STATUS_OK          = 1;
    // Tool invocation failed.
    STATUS_FAILED      = 2;
  }

  // Identifier matching the corresponding ToolCall.
  string tool_call_id = 1;

  Status status = 2;

  // Tool execution duration in milliseconds.
  int64 ms = 3;

  // The tool's result, summarised as a single typed value for the trace card.
  // Set only when status == STATUS_OK.
  // Intentionally wrapped to allow for other summary types in the future.
  oneof result_summary {
    // Number of rows/items returned, where applicable.
    int64 row_count = 4;
  }
}

// Terminal event. The response is valid and MUST be persisted to history
// as an AgentTurn, regardless of stop_reason.
message Done {
  // Why generation stopped. Every value means "there is text" — a turn
  // with no usable output is an Error, never a Done.
  enum StopReason {
    // Unspecified stop reason.
    STOP_REASON_UNSPECIFIED = 0;
    // The model finished generating text on its own.
    STOP_REASON_COMPLETED   = 1;
    // Generation was cut short (output or tool-call limit); text is coherent
    // but partial. UI marks the answer as incomplete.
    STOP_REASON_TRUNCATED   = 2;
  }

  StopReason stop_reason = 1;

  // Wall-clock for the whole turn, first event to this one.
  int64 latency_ms = 2;

  // Number of tokens consumed by the request.
  int64 tokens_in = 3;

  // Number of tokens produced by the response.
  int64 tokens_out = 4;
}

// Terminal event. No usable response was produced. The client MUST NOT
// persist the turn and SHOULD discard chunks already received.
// Transport failures (auth, rate limit, unavailable) are gRPC statuses on
// the call, not Error events. Error events are for model-level failures.
message Error {
  // UI maps this to a localised message. Clients MUST treat any
  // unrecognised value as ERROR_CODE_INTERNAL.
  // Debug detail is in server logs under request_id; nothing else travels here.
  enum Code {
    // Unspecified error code.
    ERROR_CODE_UNSPECIFIED      = 0;
    // The ML Agent refused to process the request. Never retryable.
    ERROR_CODE_MODEL_REFUSED    = 1;
    // The ML Agent's data source was unavailable.
    ERROR_CODE_DATA_UNAVAILABLE = 2;
    // An internal error occurred within the ML Agent.
    ERROR_CODE_INTERNAL         = 3;
  }

  Code code = 1;

  // Indicates whether the error is retryable by the caller.
  bool retryable = 2;
}

// Keepalive from the ML Agent to the caller. Carries no content.
message Ping {}
