syntax = "proto3";

// Live contract for the ML Agent's `ChatAgent.AskCaseManager` RPC — server-to-server,
// gRPC transport. Thoughtful Labs' own finalized 3-file contract (this file,
// case_manager.proto, common.proto — see ../../docs for the originals as received,
// and ../../docs/ARCHITECTURE.md §2 for background). Generated Java sources land
// under target/generated-sources/protobuf. GrpcMlAgentClient maps this backend's
// MlAgentRequest into AskCaseManagerRequest; AnswerEvents are not mapped at all —
// they are forwarded to the frontend verbatim (see com.cmbotservice.sse.SseEvents).

package cmbotservice.mlagent.v1;

import "common.proto";
import "case_manager.proto";

option java_package = "com.cmbotservice.mlagent.grpc.v1";
option java_multiple_files = true;

service ChatAgent {
  // Sends a single case manager chat request to the ML Agent and streams response events
  // back to the caller.
  rpc AskCaseManager(AskCaseManagerRequest) returns (stream AnswerEvent);

  // Later: rpc AskPolicyManager(AskPolicyManagerRequest) returns (stream AnswerEvent);
}

// Events arrive in the order they should be rendered.
// Consecutive `chunk` events form one text block.
// Any other event closes the current block and forms its own block.
// Note: `payload` may arrive at any point in the stream, not only at the end.
// Clients MUST ignore events whose `event` oneof is unset or unrecognised
// and continue reading the stream.
message AnswerEvent {
  oneof event {
    // Incremental text generated by the ML Agent.
    Chunk chunk = 1;

    // Indicates that the ML Agent invoked a tool.
    ToolCall tool_call = 2;

    // Result of a tool invocation.
    ToolResult tool_result = 3;

    // Structured response needing rendered UI components produced by the ML Agent.
    AnswerPayload payload = 4;

    // Terminal. The response is valid; see Done.
    Done done = 5;

    // Terminal. No usable response; see Error.
    Error error = 6;

    // Keepalive from the ML Agent to the caller.
    Ping ping = 7;
  }
}

// Union of every module's structured payload. One arm per module.
// Lives here, not in common.proto, because it must import every module file.
message AnswerPayload {
  oneof payload {
    // The payload for a Case Manager structured answer response needing UI component rendering.
    CaseManagerAnswerPayload case_manager_answer_payload = 1;
  }
}
